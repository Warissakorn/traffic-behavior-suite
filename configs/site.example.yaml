schema_version: 1
site_id: A_rama4_km3
description: "จุด A — ถนนพระราม 4 ขาเข้า"
videos:
  - path: D:/survey/A/2026-09-01_0700.mp4
    start_time: "2026-09-01T07:00:00+07:00"   # ถ้าไม่ระบุ: ชื่อไฟล์ → metadata → OCR
camera:
  model_file: calib/A_camera.yaml     # K, dist, R, t, ground planes (สร้างจาก tbs calib)
road:
  lanes:
    - id: 1
      centerline: [[0.0, 1.75], [120.0, 1.75]]   # เมตร บนพื้น
      width: 3.5
      direction: +1
    - id: 2
      centerline: [[0.0, 5.25], [120.0, 5.25]]
      width: 3.5
      direction: +1
  zones: []            # โซน OD ภายในจุด (polygon เมตร)
  count_lines:
    - id: L_ref
      p1: [60.0, 0.0]
      p2: [60.0, 7.0]
      reid_reference: true        # ใช้สร้าง sighting สำหรับ Re-ID
models:
  detector: models/yolo_th_v1.onnx
  reid: models/vehicle_reid_v1.onnx
options:
  detect_every_frame: true
  tiling_rois: []                  # บริเวณไกลที่ใช้ SAHI
  ground_method: auto              # auto | bottom_center | footprint | wheel_kp
  smoother: {model: const_accel, resample_dt: 0.1, max_accel: 8.0}
  sightings: {top_k_views: 5}

