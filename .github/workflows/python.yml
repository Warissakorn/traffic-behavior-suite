name: Python reference
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt offscreen system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev,gui]"
      - run: python tools/ci_tests.py -q
      - run: tbs demo --output benchmark-output
      - run: tbs gui --smoke
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: synthetic-${{ matrix.os }}-${{ matrix.python }}
          path: benchmark-output
          retention-days: 3
