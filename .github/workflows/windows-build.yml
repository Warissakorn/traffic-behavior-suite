name: Windows portable test

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'tools/windows/**'
      - 'tests/**'
      - 'configs/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'
      - 'docs/**'
      - '*Windows.cmd'
  pull_request:
    paths:
      - 'python/**'
      - 'tools/windows/**'
      - 'tests/**'
      - 'configs/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'
      - 'docs/**'
      - '*Windows.cmd'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Portable package to build'
        type: choice
        options: [both, cpu, cuda]
        default: both

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Windows ${{ matrix.profile }}
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profile != 'both' && format('["{0}"]', inputs.profile) || '["cpu","cuda"]') }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      YOLO_AUTOINSTALL: 'false'
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned CPU or NVIDIA CUDA runtime
        run: python tools/windows/install_profile.py --profile ${{ matrix.profile }} --build
      - name: Run source regression tests
        run: python -m pytest -q -rs
      - name: Build portable executables and exercise frozen inference and GUI
        run: python tools/windows/ci_build.py --profile ${{ matrix.profile }}
      - name: Downloadable Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: TBS-Windows-${{ matrix.profile }}
          path: |
            dist/TBS-Windows-${{ matrix.profile }}.zip
            dist/TBS-Windows-${{ matrix.profile }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.profile }}
          path: |
            build/portable/**/*.txt
            dist/TBS/build-info.json
            dist/TBS/runtime-smoke.json
            dist/TBS/runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Explain package and hardware validation
        shell: pwsh
        run: |
          @'
          ## TBS Windows portable test package
          Download **TBS-Windows-${{ matrix.profile }}** under Artifacts on this run.
          Extract the artifact, then extract its inner ZIP and run `TBS/TBS.exe`.
          This build includes local YOLO inference, ROI, candidate review and OD tools.
          Model weights are selected/downloaded in the app; no pretrained weights are bundled.
          The runner tests frozen YOLO11/YOLO26 and ONNX Re-ID inference on CPU plus GUI/worker startup.
          CUDA DLL/provider packaging is checked; this hosted runner has no NVIDIA GPU.
          For NVIDIA testing, use the CUDA package with a compatible driver and run `Test-GPU.cmd`.
          '@ >> $env:GITHUB_STEP_SUMMARY
